services:
  postgres:
    image: postgres:16-alpine
    container_name: sar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sardb
      POSTGRES_USER: saruser
      POSTGRES_PASSWORD: sarpass
    ports:
      - "5432:5432"
    volumes:
      - sar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saruser -d sardb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sar_pgdata:
    driver: local
