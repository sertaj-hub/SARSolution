spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

sar:
  efiling:
    mode: offline
    scheduler:
      enabled: false
    validation:
      use-online-schema: false
  case-management:
    type: rest
    base-url: http://localhost:9999

logging:
  level:
    com.fincen.sar: DEBUG
